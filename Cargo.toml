[workspace]
resolver = "3"
members = [
    "crates/switchyard-protocol",
    "crates/switchyard-events",
    "crates/switchyard-storage",
    "crates/switchyard-git",
    "crates/switchyard-client",
    "crates/switchyard-agents",
    "crates/switchyard-workspaces",
    "crates/switchyard-policy",
    "crates/switchyard-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
switchyard-protocol = { path = "crates/switchyard-protocol" }
switchyard-events = { path = "crates/switchyard-events" }
switchyard-storage = { path = "crates/switchyard-storage" }
switchyard-git = { path = "crates/switchyard-git" }
switchyard-client = { path = "crates/switchyard-client" }
switchyard-agents = { path = "crates/switchyard-agents" }
switchyard-workspaces = { path = "crates/switchyard-workspaces" }
switchyard-policy = { path = "crates/switchyard-policy" }

tokio = { version = "1.54", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3.27"
nix = { version = "0.31", default-features = false, features = ["signal"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
