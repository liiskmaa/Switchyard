[package]
name = "switchyard-core"
description = "Switchyard Core: the long-running local orchestration process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "switchyard-core"
path = "src/main.rs"

[dependencies]
switchyard-protocol.workspace = true
switchyard-events.workspace = true
switchyard-storage.workspace = true
switchyard-git.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }

[dev-dependencies]
switchyard-client.workspace = true
tempfile.workspace = true

[lints]
workspace = true
