[package]
name = "switchyard-core"
description = "Switchyard Core: the long-running local orchestration process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "switchyard-core"
path = "src/main.rs"

# Deterministic stand-in for the `claude` CLI, used by integration tests.
# Never bundled (only `switchyard-core` is a Tauri externalBin).
[[bin]]
name = "switchyard-fake-claude"
path = "src/bin/fake_claude.rs"

[[bin]]
name = "switchyard-fake-codex"
path = "src/bin/fake_codex.rs"

[dependencies]
switchyard-protocol.workspace = true
switchyard-events.workspace = true
switchyard-storage.workspace = true
switchyard-git.workspace = true
switchyard-agents.workspace = true
switchyard-workspaces.workspace = true
switchyard-policy.workspace = true
switchyard-tasks.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }

[dev-dependencies]
switchyard-client.workspace = true
tempfile.workspace = true
# Policy tests inject rows and failures through a second SQLite connection.
rusqlite.workspace = true

[lints]
workspace = true
